[taa]
; Passo 1: deixe discovery=1 e cb_size=0, rode o jogo e leia taa_mod.log.
discovery=1
enable=1

; Passo 2: preencha apos achar o cbuffer da camera no log.
; cb_size        = tamanho em bytes do cbuffer que contem a projecao
; jitter_x_offset= offset em bytes de proj[2][0] (linha 3, coluna 1) dentro do cbuffer
; jitter_y_offset= offset em bytes de proj[2][1]
cb_size=0
jitter_x_offset=-1
jitter_y_offset=-1
; troque para -1.0 se a imagem "tremer" na direcao errada / aparecer borrao
jitter_sign=1.0
jitter_count=8

; peso do frame atual (menor = mais suave, mais ghosting)
blend=0.10

; Passo 3 (opcional): usar buffer de velocidade detectado
use_velocity=0
velocity_scale=1.0
